<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>3D FPS Arena</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111;color:white;font-family:Arial}
#game{width:100vw;height:100vh;display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
.panel{background:#0009;padding:10px 14px;border-radius:10px}
#aim{position:fixed;top:50%;left:50%;width:18px;height:18px;transform:translate(-50%,-50%);pointer-events:none}
#aim:before,#aim:after{content:"";position:absolute;background:white}
#aim:before{width:18px;height:2px;top:8px}
#aim:after{width:2px;height:18px;left:8px}
#controls{position:fixed;bottom:20px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end}
.pad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;gap:4px}
button{border:1px solid #ffffff70;border-radius:12px;background:#ffffff30;color:white;font-size:20px;touch-action:none}
#fire{width:80px;height:80px;border-radius:50%;background:#b52c2ccc}
#look{position:fixed;inset:35% 0 25% 42%;touch-action:none}
#message{position:fixed;top:42%;width:100%;text-align:center;font-size:20px;text-shadow:0 2px 4px black;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="panel">3D ARENA</div><div class="panel" id="stats">Loading...</div></div>
<div id="aim"></div>
<div id="message">Loading 3D world...</div>
<div id="look"></div>
<div id="controls">
  <div class="pad">
    <span></span><button data-move="forward">▲</button><span></span>
    <button data-move="left">◀</button><button data-move="back">▼</button><button data-move="right">▶</button>
    <span></span><button data-move="jump">⬆</button><span></span>
  </div>
  <button id="fire">FIRE</button>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';

const canvas=document.querySelector('#game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87b6d9);
scene.fog=new THREE.Fog(0x87b6d9,25,100);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,150);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=false;

scene.add(new THREE.HemisphereLight(0xffffff,0x566477,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(10,20,8);scene.add(sun);

const mat=(color)=>new THREE.MeshStandardMaterial({color,roughness:.9});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),mat(0x64744d));
floor.rotation.x=-Math.PI/2;floor.position.y=-.05;scene.add(floor);
const grid=new THREE.GridHelper(100,50,0x35482d,0x536744);
grid.position.y=0;scene.add(grid);

function box(x,y,z,w,h,d,color){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
 m.position.set(x,y,z);scene.add(m);return m;
}
for(let i=-2;i<=2;i++){
 box(i*7,1.5,-14,5,3,2,0x777d85);
 box(i*7,1.5,14,5,3,2,0x777d85);
 box(-14,1.5,i*7,2,3,5,0x777d85);
 box(14,1.5,i*7,2,3,5,0x777d85);
}
box(-5,1,-5,3,2,3,0x9b7755);
box(5,1,-4,3,2,3,0x9b7755);
box(0,1,5,4,2,2,0x9b7755);
box(8,1,5,2,2,5,0x9b7755);
box(-8,1,6,2,2,5,0x9b7755);

const player={x:0,y:1.7,z:8,yaw:0,pitch:0};
const keys={};
let shots=0;
camera.position.set(player.x,player.y,player.z);
function updateCamera(){
 camera.position.set(player.x,player.y,player.z);
 camera.rotation.order='YXZ';
 camera.rotation.y=player.yaw;
 camera.rotation.x=player.pitch;
}
document.querySelectorAll('[data-move]').forEach(b=>{
 const k=b.dataset.move;
 const down=e=>{e.preventDefault();keys[k]=true};
 const up=e=>{e.preventDefault();keys[k]=false};
 b.addEventListener('pointerdown',down);
 b.addEventListener('pointerup',up);
 b.addEventListener('pointercancel',up);
 b.addEventListener('pointerleave',up);
});
let lastX=null,lastY=null;
document.querySelector('#look').addEventListener('pointerdown',e=>{
 lastX=e.clientX;lastY=e.clientY;
 document.querySelector('#look').setPointerCapture(e.pointerId);
});
document.querySelector('#look').addEventListener('pointermove',e=>{
 if(lastX===null)return;
 player.yaw-=(e.clientX-lastX)*.006;
 player.pitch-=(e.clientY-lastY)*.006;
 player.pitch=Math.max(-1.35,Math.min(1.35,player.pitch));
 lastX=e.clientX;lastY=e.clientY;
});
function endLook(){lastX=null;lastY=null}
document.querySelector('#look').addEventListener('pointerup',endLook);
document.querySelector('#look').addEventListener('pointercancel',endLook);

document.querySelector('#fire').addEventListener('pointerdown',e=>{
 e.preventDefault();shots++;
 const ray=new THREE.Raycaster();
 ray.setFromCamera(new THREE.Vector2(0,0),camera);
 const hit=ray.intersectObjects(scene.children,false).length>0;
 document.querySelector('#stats').textContent='Shots: '+shots;
 document.querySelector('#message').textContent=hit?'Shot fired!':'Miss!';
 setTimeout(()=>document.querySelector('#message').textContent='',500);
});

function animate(){
 requestAnimationFrame(animate);
 const speed=.12;
 const forward=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));
 const right=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));
 if(keys.forward){player.x+=forward.x*speed;player.z+=forward.z*speed}
 if(keys.back){player.x-=forward.x*speed;player.z-=forward.z*speed}
 if(keys.left){player.x-=right.x*speed;player.z-=right.z*speed}
 if(keys.right){player.x+=right.x*speed;player.z+=right.z*speed}
 player.x=Math.max(-12,Math.min(12,player.x));
 player.z=Math.max(-12,Math.min(12,player.z));
 updateCamera();
 renderer.render(scene,camera);
}
animate();
document.querySelector('#message').textContent='Move with the arrows. Drag the right side to look around.';
document.querySelector('#stats').textContent='Ready';
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
  </html>
