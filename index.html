<style>

</style></head><body><div id="view"></div>
<div id="menu"><div class="panel"><h1>SHADOW <em>OPS</em></h1><div class="tag">TACTICAL FPS // MOBILE</div><div class="banner"><small>OPERATION: DUST DISTRICT</small><b>ورود به منطقه عملیاتی</b></div>
<button id="training">شروع نبرد تمرینی</button><button id="create" class="alt">ساخت اتاق آنلاین</button><input id="code" maxlength="12" placeholder="کد اتاق دوستت"><button id="join" class="alt">پیوستن به اتاق</button><div id="status">نسخه آزمایشی گرافیک واقع‌گرایانه</div><div class="disclaimer">برای اجرای بهتر، گوشی را افقی نگه دار. این نسخه نمونه مستقل CS2 نیست؛ یک پروژه FPS تحت وب است.</div></div></div>
<div id="hud"><div class="top"><div class="badge" id="mode">TRAINING</div><div class="badge" id="score">KILLS 0</div><div class="badge" id="info">HP 100 | 30/90</div></div><button id="quit">منو</button><div id="cross">+</div><div id="hint">سمت راست را بکش تا نگاه کنی</div><div id="look"></div><div id="controls"><div class="pad"><button class="ctl" id="up">▲</button><button class="ctl" id="lt">◀</button><button class="ctl" id="dn">▼</button><button class="ctl" id="rt">▶</button></div><div style="display:flex;gap:8px;align-items:end"><button class="ctl" id="reload">خشاب</button><button id="fire">FIRE</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(()=>{const $=x=>document.getElementById(x);let scene,camera,renderer,clock,started=false,peer,conn,online=false,other=null,bot=[],walls=[],keys={},yaw=0,pitch=0,px=0,py=0,lookId=null,lastSend=0,lastFire=0,reloadBusy=false,kills=0,hp=100,ammo=30,reserve=90,me={x:0,z:12},enemy={x:0,z:-12};
const mat=(c,r=.85,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
function tex(base,kind){let c=document.createElement('canvas');c.width=c.height=256;let g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,256,256);for(let i=0;i<2500;i++){let v=Math.random()*55;g.fillStyle=`rgba(${v},${v},${v},${Math.random()*.22})`;g.fillRect(Math.random()*256,Math.random()*256,1+Math.random()*4,1+Math.random()*4)}if(kind==='brick'){g.strokeStyle='#2229';for(let y=0;y<256;y+=32){g.beginPath();g.moveTo(0,y);g.lineTo(256,y);g.stroke();for(let x=(y/32%2)*32;x<256;x+=64){g.beginPath();g.moveTo(x,y);g.lineTo(x,y+32);g.stroke()}}}if(kind==='concrete'){for(let i=0;i<70;i++){g.fillStyle='#2222';g.fillRect(Math.random()*256,Math.random()*256,Math.random()*18,Math.random()*3)}}let t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,2);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=Math.min(renderer?.capabilities?.getMaxAnisotropy?.()||4,8);return t}
function textured(color,kind){return new THREE.MeshStandardMaterial({map:tex(color,kind),roughness:.96})}
function addBox(x,y,z,w,h,d,m,collide=true){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);if(collide)walls.push({x,z,w,d});return o}
function soldier(color){let g=new THREE.Group(),cloth=mat(color),dark=mat(0x22292c),skin=mat(0x9b8066),vest=mat(0x3b4039);let torso=new THREE.Mesh(new THREE.CapsuleGeometry(.34,.72,5,8),cloth);torso.position.y=1.15;torso.castShadow=true;g.add(torso);let chest=new THREE.Mesh(new THREE.BoxGeometry(.62,.48,.38),vest);chest.position.set(0,1.3,-.04);g.add(chest);let head=new THREE.Mesh(new THREE.SphereGeometry(.23,16,12),skin);head.position.y=1.83;g.add(head);let helmet=new THREE.Mesh(new THREE.SphereGeometry(.255,16,10,0,Math.PI*2,0,Math.PI*.55),dark);helmet.position.y=1.91;g.add(helmet);for(let x of [-.17,.17]){let leg=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.58,4,7),dark);leg.position.set(x,.43,0);g.add(leg);let arm=new THREE.Mesh(new THREE.CapsuleGeometry(.11,.5,4,7),cloth);arm.position.set(x*.0+(x<0?-.42:.42),1.22,-.12);arm.rotation.z=x<0?-.28:.28;g.add(arm)}let gun=new THREE.Group();let body=new THREE.Mesh(new THREE.BoxGeometry(.16,.16,.65),mat(0x252b2c,.42,.7));body.position.z=-.28;gun.add(body);let barrel=new THREE.Mesh(new THREE.CylinderGeometry(.027,.027,.48,10),mat(0x111719,.4,.8));barrel.rotation.x=Math.PI/2;barrel.position.set(0,.015,-.78);gun.add(barrel);let mag=new THREE.Mesh(new THREE.BoxGeometry(.09,.24,.13),dark);mag.position.set(0,-.17,-.27);gun.add(mag);gun.position.set(.31,1.25,-.37);g.add(gun);return g}
function world(){walls=[];scene=new THREE.Scene();scene.background=new THREE.Color(0x9da9ad);scene.fog=new THREE.Fog(0x9da9ad,35,105);camera=new THREE.PerspectiveCamera(76,innerWidth/innerHeight,.08,180);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.9));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.shadowMap.autoUpdate=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.22;renderer.info.autoReset=true;$('view').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe5efff,0x45413a,1.8));let sun=new THREE.DirectionalLight(0xffe3bd,3.5);sun.position.set(-18,28,12);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;scene.add(sun);scene.add(new THREE.AmbientLight(0x71849a,.45));
let asphalt=textured('#555b5d','concrete'),brick=textured('#81786d','brick'),cement=textured('#99958b','concrete'),metal=mat(0x394349,.45,.65),yellow=mat(0xd6a72e),wood=textured('#71563a','brick');addBox(0,-.35,0,62,.7,62,asphalt,false);
for(let z of [-30,30])addBox(0,2,z,62,4,1,brick);for(let x of [-30,30])addBox(x,2,0,1,4,62,brick);
 // city blocks with windows
 for(let [x,z,w,d,h] of [[-20,-17,14,13,10],[20,-18,13,14,13],[-21,18,13,15,12],[21,18,14,13,9],[-7,-25,9,7,7],[8,25,10,7,8]]){
 addBox(x,h/2,z,w,h,d,cement);addBox(x,h+.12,z,w+.3,.25,d+.3,metal,false);
 for(let yy=2;yy<h-1.5;yy+=2.4)for(let xx=-w/2+1.4;xx<w/2-1;xx+=2.5){let win=addBox(x+xx,yy,z-d/2-.015,1.1,1,.06,mat(0x283a43,.25,.35),false);let frame=addBox(x+xx,yy,z-d/2-.06,1.28,1.18,.05,metal,false)}
 }
 // alleys, warehouse, cover
 addBox(0,2,-14,17,4,1.2,brick);addBox(-8.5,2,-7,1.2,14,brick);addBox(8.5,2,-7,1.2,14,brick);
 for(let [x,z] of [[-5,4],[5,9],[-13,-1],[13,4],[-3,-19],[3,19],[-17,10],[17,-10]]){addBox(x,.9,z,2.4,1.8,2.1,wood);addBox(x,.92,z+1.08,2.35,.08,.05,yellow,false)}
 for(let [x,z] of [[-10,-10],[10,13],[-24,3],[24,-4]]){let drum=new THREE.Mesh(new THREE.CylinderGeometry(.45,.45,1.3,18),metal);drum.position.set(x,.65,z);drum.castShadow=true;scene.add(drum);walls.push({x,z,w:1.05,d:1.05})}
 // Additional architectural trim and environmental surface detail
 for(let [x,z,w,d,h] of [[-20,-17,14,13,10],[20,-18,13,14,13],[-21,18,13,15,12],[21,18,14,13,9],[-7,-25,9,7,7],[8,25,10,7,8]]){
   addBox(x,h*.72,z-d/2-.09,w,.16,.18,metal,false);
   addBox(x,h*.28,z-d/2-.09,w,.12,.18,metal,false);
   addBox(x-w/2+.12,h+.22,z,w-.24,.22,.22,metal,false);
 }
 for(let [x,z] of [[-14,-18],[14,-18],[-14,18],[14,18]]){
   addBox(x,.55,z,.9,1.1,.9,metal,false);
   addBox(x,.08,z,.95,.12,.95,mat(0x252d30),false);
 }
 for(let i=0;i<22;i++){
   let x=(Math.random()-.5)*48,z=(Math.random()-.5)*48;
   if(Math.abs(x)<9&&Math.abs(z)<9)continue;
   let stain=new THREE.Mesh(new THREE.CircleGeometry(.35+Math.random()*.65,16),new THREE.MeshBasicMaterial({color:0x303638,transparent:true,opacity:.13,depthWrite:false}));
   stain.rotation.x=-Math.PI/2;stain.position.set(x,.012,z);stain.scale.y=.45;scene.add(stain);
 }
 // road markings and street lights
 for(let z=-25;z<=25;z+=7)addBox(0,.008,z,20,.02,.09,yellow,false);
 for(let x of [-26,26]){addBox(x,4,0,.16,8,.16,metal,false);addBox(x,8,0,.9,.18,.9,yellow,false)}
 // distant skyline silhouettes
 for(let i=0;i<18;i++){let x=(Math.random()-.5)*90,z=(Math.random()-.5)*90;if(Math.abs(x)<32&&Math.abs(z)<32)continue;addBox(x,3+Math.random()*7,z,5+Math.random()*7,6+Math.random()*14,5+Math.random()*7,brick,false)}
 other=soldier(0x3b4c42);other.position.set(enemy.x,0,enemy.z);scene.add(other);
 if(!online){for(let i=0;i<4;i++){let b=soldier(i%2?0x5c5544:0x35463d);b.position.set((Math.random()-.5)*25,0,-8-Math.random()*16);b.userData={hp:100,fire:0};scene.add(b);bot.push(b)}}
 let gun=soldier(0x3d493e); // player-view weapon only
 let weapon=new THREE.Group();let base=new THREE.Mesh(new THREE.BoxGeometry(.19,.19,.72),mat(0x222a2c,.35,.7));base.position.set(.34,-.29,-.55);weapon.add(base);let barrel=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.62,12),metal);barrel.rotation.x=Math.PI/2;barrel.position.set(.34,-.25,-1.05);weapon.add(barrel);let sight=new THREE.Mesh(new THREE.BoxGeometry(.1,.09,.18),mat(0x111819,.3,.5));sight.position.set(.34,-.16,-.55);weapon.add(sight);let rail=new THREE.Mesh(new THREE.BoxGeometry(.08,.045,.5),mat(0x41494a,.4,.65));rail.position.set(.34,-.17,-.58);weapon.add(rail);camera.add(weapon);scene.add(camera)}
function start(mode){if(started)return;if(!window.THREE){$('status').textContent='Three.js لود نشد؛ اینترنت را بررسی کن.';return}started=true;$('menu').style.display='none';$('hud').style.display='block';$('mode').textContent=mode;world();clock=new THREE.Clock();loop()}
function movePlayer(dx,dz){const r=.48;function blocked(x,z){if(x<-29.1||x>29.1||z<-29.1||z>29.1)return true;return walls.some(o=>Math.abs(x-o.x)<o.w/2+r&&Math.abs(z-o.z)<o.d/2+r)}let nx=me.x+dx;if(!blocked(nx,me.z))me.x=nx;let nz=me.z+dz;if(!blocked(me.x,nz))me.z=nz;}
function loop(){if(!started)return;requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.04),f=(keys.up?1:0)-(keys.dn?1:0),s=(keys.rt?1:0)-(keys.lt?1:0);let v=5.2*dt,mag=Math.hypot(f,s)||1;if(f||s){f/=mag;s/=mag;let nx=Math.sin(yaw)*f+Math.cos(yaw)*s,nz=-Math.cos(yaw)*f+Math.sin(yaw)*s;movePlayer(nx*v,nz*v)}camera.position.set(me.x,1.68,me.z);camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0);
bot.forEach(b=>{let dx=me.x-b.position.x,dz=me.z-b.position.z,dist=Math.hypot(dx,dz);if(dist>5&&dist<26){b.position.x+=dx/dist*.018;b.position.z+=dz/dist*.018;b.rotation.y=Math.atan2(-dx,-dz)}b.userData.fire-=dt;if(dist<15&&b.userData.fire<=0){b.userData.fire=1.8+Math.random();if(Math.random()<.28){hp=Math.max(0,hp-4);updateInfo()}}});
if(online&&conn?.open&&performance.now()-lastSend>60){conn.send({t:'p',x:me.x,z:me.z,yaw});lastSend=performance.now()}
if(other){other.position.set(enemy.x,0,enemy.z);other.rotation.y=enemy.yaw}
renderer.render(scene,camera)}
function updateInfo(){$('info').textContent=`HP ${hp} | ${ammo}/${reserve}`}
function fire(){if(!started||reloadBusy||performance.now()-lastFire<180)return;lastFire=performance.now();if(ammo<=0){toast('خشاب خالی است');return}ammo--;updateInfo();let ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(0,0),camera);let targets=bot.concat(online&&other?[other]:[]);let hits=ray.intersectObjects(targets,true);if(hits.length&&hits[0].distance<35){let target=hits[0].object;while(target.parent&&!targets.includes(target))target=target.parent;if(bot.includes(target)||targets.includes(target)){let b=target;if(bot.includes(b)){b.userData.hp-=40;if(b.userData.hp<=0){scene.remove(b);bot=bot.filter(q=>q!==b);kills++;$('score').textContent='KILLS '+kills;toast('هدف حذف شد')}}else if(conn?.open)conn.send({t:'hit'})}}}
function toast(t){$('hint').textContent=t;setTimeout(()=>$('hint').textContent='سمت راست را بکش تا نگاه کنی',1300)}
function reload(){if(reloadBusy||ammo===30||reserve<=0)return;reloadBusy=true;toast('تعویض خشاب...');setTimeout(()=>{let n=Math.min(30-ammo,reserve);ammo+=n;reserve-=n;reloadBusy=false;updateInfo()},1150)}
function bind(id,k){let e=$(id);e.onpointerdown=v=>{v.preventDefault();keys[k]=true;e.setPointerCapture(v.pointerId)};['pointerup','pointercancel','lostpointercapture'].forEach(a=>e.addEventListener(a,()=>keys[k]=false))}
[['up','up'],['dn','dn'],['lt','lt'],['rt','rt']].forEach(a=>bind(...a));$('fire').onpointerdown=fire;$('reload').onclick=reload;
$('look').onpointerdown=e=>{lookId=e.pointerId;px=e.clientX;py=e.clientY;$('look').setPointerCapture(e.pointerId)};$('look').onpointermove=e=>{if(lookId!==e.pointerId)return;let dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;yaw-=dx*.006;pitch=THREE.MathUtils.clamp(pitch+dy*.004,-1.1,1.1)};['pointerup','pointercancel','lostpointercapture'].forEach(a=>$('look').addEventListener(a,()=>lookId=null));
addEventListener('keydown',e=>{let m={KeyW:'up',KeyS:'dn',KeyA:'lt',KeyD:'rt'};if(m[e.code])keys[m[e.code]]=true;if(e.code==='Space')fire();if(e.code==='KeyR')reload()});addEventListener('keyup',e=>{let m={KeyW:'up',KeyS:'dn',KeyA:'lt',KeyD:'rt'};if(m[e.code])keys[m[e.code]]=false});
$('training').onclick=()=>start('TRAINING');$('create').onclick=()=>{if(!window.Peer){$('status').textContent='سرویس آنلاین لود نشد.';return}let id='SHADOW'+Math.random().toString(36).slice(2,6).toUpperCase();peer=new Peer(id);$('status').textContent='در حال ساخت اتاق...';peer.on('open',()=>{$('code').value=id;$('status').textContent='کد اتاق: '+id+' را برای دوستت بفرست'});peer.on('connection',c=>{conn=c;wire();start('ONLINE HOST')});peer.on('error',e=>$('status').textContent='خطا: '+e.type)};
$('join').onclick=()=>{let id=$('code').value.trim().toUpperCase();if(!id){$('status').textContent='کد اتاق را وارد کن';return}peer=new Peer();$('status').textContent='در حال اتصال...';peer.on('open',()=>{conn=peer.connect(id);conn.on('open',()=>{wire();start('ONLINE GUEST')})});peer.on('error',e=>$('status').textContent='اتصال ناموفق: '+e.type)};
function wire(){online=true;conn.on('data',d=>{if(d.t==='p'){enemy.x=d.x;enemy.z=d.z;enemy.yaw=d.yaw}if(d.t==='hit'){hp=Math.max(0,hp-25);updateInfo()}})}
$('quit').onclick=()=>location.reload();addEventListener('resize',()=>{if(renderer){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}});if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
